[package]
name = "docli"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false ,features = ["json", "rustls","blocking"]}
tar = "0.4.46"
uuid = { version = "1.29.2", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
rayon = "1.12.0"
sha2 = "0.11.1"
hex = "0.4.3"
keyring = { version = "4.2", features = ["zbus-secret-service-keyring-store"] }
